<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--black:#0a0a0a;--black-soft:#121212;--dark-900:#1a1a1a;--dark-800:#232323;--dark-700:#2e2e2e;--dark-600:#3d3d3d;--gray-500:#6b6b6b;--gray-400:#9a9a9a;--gray-300:#c4c4c4;--gray-200:#e0e0e0;--white:#fff;--gold-900:#7a5c1e;--gold-700:#a8802e;--gold-500:#cda449;--gold-400:#d9b968;--gold-300:#e6cd8f;--gold-100:#f4e8c9;--success:#3d9a6a;--danger:#b3453f;--font:'Inter',-apple-system,sans-serif}
body{font-family:var(--font);background:var(--black);color:var(--gray-200);direction:rtl;min-height:100vh}
.header{background:linear-gradient(180deg,var(--black) 0%,var(--dark-900) 100%);padding:80px 40px 50px;text-align:center;border-bottom:1px solid var(--dark-700);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 50% 0%,rgba(205,164,73,0.08),transparent 60%);pointer-events:none}
.logo{font-size:1.2em;font-weight:700;color:var(--gold-500);letter-spacing:0.15em;margin-bottom:8px;position:relative}
.header h1{font-size:3em;font-weight:700;color:var(--white);margin-bottom:12px;position:relative;letter-spacing:-0.02em}
.header p{color:var(--gray-400);font-size:1.1em;position:relative;max-width:600px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:60px;margin-top:40px;position:relative}
.stat{text-align:center}
.stat-num{font-size:2.5em;font-weight:700;color:var(--gold-500);line-height:1}
.stat-label{color:var(--gray-500);font-size:0.85em;margin-top:6px;letter-spacing:0.05em}
.controls{padding:24px 40px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:center;border-bottom:1px solid var(--dark-700);background:var(--black-soft)}
.search{background:var(--dark-800);border:1px solid var(--dark-600);color:var(--white);padding:14px 24px;border-radius:12px;font-size:1em;width:360px;font-family:var(--font);direction:rtl}
.search::placeholder{color:var(--gray-500)}
.search:focus{outline:none;border-color:var(--gold-500);box-shadow:0 0 0 3px rgba(205,164,73,0.15)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.filter-btn{background:var(--dark-800);border:1px solid var(--dark-600);color:var(--gray-400);padding:8px 18px;border-radius:24px;cursor:pointer;transition:all 0.2s;font-size:0.85em;font-family:var(--font)}
.filter-btn:hover{border-color:var(--gold-500);color:var(--gold-400)}
.filter-btn.active{background:var(--gold-500);color:var(--black);border-color:var(--gold-500);font-weight:600}
.tabs{display:flex;gap:0;justify-content:center;margin-top:20px;position:relative}
.tab{padding:12px 32px;cursor:pointer;color:var(--gray-500);font-weight:500;border-bottom:2px solid transparent;transition:all 0.2s;font-size:0.95em}
.tab:hover{color:var(--gray-300)}
.tab.active{color:var(--gold-500);border-bottom-color:var(--gold-500)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;padding:30px 40px;max-width:1400px;margin:0 auto}
.card{background:var(--dark-900);border:1px solid var(--dark-700);border-radius:16px;overflow:hidden;transition:all 0.3s;cursor:pointer;position:relative;text-decoration:none;display:block}
.card:hover{transform:translateY(-4px);border-color:var(--gold-500);box-shadow:0 20px 40px rgba(0,0,0,0.4)}
.card-preview{height:180px;background:var(--dark-800);position:relative;overflow:hidden}
.card-preview iframe{width:200%;height:200%;transform:scale(0.5);transform-origin:top right;border:none;pointer-events:none;position:absolute;top:0;right:0}
.card-info{padding:20px}
.card-title{font-size:0.95em;font-weight:600;margin-bottom:10px;color:var(--white);line-height:1.4}
.card-meta{display:flex;justify-content:space-between;align-items:center}
.card-category{font-size:0.75em;padding:4px 12px;border-radius:12px;font-weight:500;letter-spacing:0.03em}
.cat-live{background:rgba(61,154,106,0.15);color:var(--success)}
.cat-demo{background:rgba(205,164,73,0.12);color:var(--gold-400)}
.cat-medical{background:rgba(108,99,255,0.12);color:#6c63ff}
.cat-commerce{background:rgba(0,212,170,0.12);color:#00d4aa}
.cat-services{background:rgba(255,107,107,0.12);color:#ff6b6b}
.cat-education{background:rgba(78,205,196,0.12);color:#4ecdc4}
.cat-travel{background:rgba(69,183,209,0.12);color:#45b7d1}
.cat-sports{background:rgba(255,217,61,0.12);color:#ffd93d}
.cat-food{background:rgba(255,159,243,0.12);color:#ff9ff3}
.card-link{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(205,164,73,0.95);opacity:0;transition:opacity 0.3s;text-decoration:none;color:var(--black);font-size:1em;font-weight:600;letter-spacing:0.05em}
.card:hover .card-link{opacity:1}
.counter{text-align:center;padding:12px;color:var(--gray-500);font-size:0.9em}
footer{text-align:center;padding:40px;color:var(--gray-500);border-top:1px solid var(--dark-700);font-size:0.85em}
footer span{color:var(--gold-500)}
@media(max-width:768px){.grid{grid-template-columns:1fr;padding:16px}.header{padding:40px 20px 30px}.header h1{font-size:2em}.controls{padding:16px}.search{width:100%}.stats{gap:30px}}
</style>
</head>

const grid=document.getElementById('grid');
const search=document.getElementById('search');
const filtersEl=document.getElementById('filters');
const counter=document.getElementById('counter');
const tabs=document.querySelectorAll('.tab');

let activeTab='all';
let activeCat='الكل';

const liveCount=allProjects.filter(p=>p.live).length;
const demoCount=allProjects.filter(p=>!p.live).length;
const cats=[...new Set(allProjects.map(p=>p.cat))].sort();

document.getElementById('stat-total').textContent=allProjects.length;
document.getElementById('stat-live').textContent=liveCount;
document.getElementById('stat-demo').textContent=demoCount;
document.getElementById('stat-cats').textContent=cats.length;

filtersEl.innerHTML='<button class="filter-btn active" data-cat="الكل">الكل</button>'+
cats.map(c=>'<button class="filter-btn" data-cat="'+c+'">'+c+'</button>').join('');

filtersEl.addEventListener('click',e=>{
if(!e.target.classList.contains('filter-btn'))return;
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
e.target.classList.add('active');
activeCat=e.target.dataset.cat;
render();
});

tabs.forEach(tab=>{
tab.addEventListener('click',()=>{
tabs.forEach(t=>t.classList.remove('active'));
tab.classList.add('active');
activeTab=tab.dataset.tab;
render();
});
});

function render(){
const q=search.value.toLowerCase();
const filtered=allProjects.filter(p=>{
const matchSearch=!q||p.t.toLowerCase().includes(q)||p.c.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q);
let matchTab=true;
if(activeTab==='live')matchTab=p.live;
else if(activeTab==='demo')matchTab=!p.live;
let matchCat=activeCat==='الكل'||p.cat===activeCat;
return matchSearch&&matchTab&&matchCat;
});

counter.textContent='عرض '+filtered.length+' من '+allProjects.length;

grid.innerHTML=filtered.map(p=>{
const catClass=catClasses[p.cat]||'cat-web';
const badgeClass=p.live?'cat-live':'cat-demo';
const badgeText=p.live?'تفاعلي':'ديمو';
if(p.live&&p.f){
return'<a class="card" href="'+p.f+'" target="_blank">'+
'<div class="card-preview"><iframe src="'+p.f+'" loading="lazy"></iframe></div>'+
'<div class="card-info">'+
'<div class="card-title">'+p.t+'</div>'+
'<div class="card-meta">'+
'<span class="card-category '+catClass+'">'+p.cat+'</span>'+
'<span class="card-category '+badgeClass+'">'+badgeText+'</span>'+
'</div>'+
'</div>'+
'</a>';
}else{
return'<div class="card">'+
'<div class="card-info">'+
'<div class="card-title">'+p.t+'</div>'+
'<div class="card-meta">'+
'<span class="card-category '+catClass+'">'+p.cat+'</span>'+
'<span class="card-category '+badgeClass+'">'+badgeText+'</span>'+
'</div>'+
'</div>'+
'</div>';
}
}).join('');
}

search.addEventListener('input',render);
render();
