<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:#14141f;--card-hover:#1a1a2e;--accent:#6c63ff;--accent2:#00d4aa;--text:#e0e0e0;--text-dim:#888;--border:#222;--glow:rgba(108,99,255,0.15)}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--text);direction:rtl;min-height:100vh}
.header{background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3e 50%,#0a0a1a 100%);padding:60px 40px 40px;text-align:center;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.header::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle at 30% 50%,var(--glow),transparent 50%);pointer-events:none}
.header h1{font-size:2.5em;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px;position:relative}
.header p{color:var(--text-dim);font-size:1.1em;position:relative}
.stats{display:flex;justify-content:center;gap:40px;margin-top:30px;position:relative}
.stat{text-align:center}
.stat-num{font-size:2em;font-weight:700;color:var(--accent)}
.stat-label{color:var(--text-dim);font-size:0.9em}
.controls{padding:20px 40px;display:flex;gap:15px;flex-wrap:wrap;align-items:center;justify-content:center;border-bottom:1px solid var(--border)}
.search{background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px 20px;border-radius:10px;font-size:1em;width:300px;direction:rtl}
.search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.filter-btn{background:var(--card);border:1px solid var(--border);color:var(--text-dim);padding:8px 16px;border-radius:20px;cursor:pointer;transition:all 0.3s;font-size:0.9em}
.filter-btn:hover,.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;padding:30px 40px;max-width:1600px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;transition:all 0.3s;cursor:pointer;position:relative}
.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 10px 40px rgba(108,99,255,0.2)}
.card-preview{height:200px;background:#111;position:relative;overflow:hidden}
.card-preview iframe{width:200%;height:200%;transform:scale(0.5);transform-origin:top right;border:none;pointer-events:none;position:absolute;top:0;right:0}
.card-info{padding:16px}
.card-title{font-size:1em;font-weight:600;margin-bottom:6px;color:#fff}
.card-meta{display:flex;justify-content:space-between;align-items:center}
.card-category{font-size:0.8em;color:var(--accent);background:var(--glow);padding:3px 10px;border-radius:10px}
.card-size{font-size:0.8em;color:var(--text-dim)}
.card-link{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(108,99,255,0.9);opacity:0;transition:opacity 0.3s;text-decoration:none;color:#fff;font-size:1.2em;font-weight:600}
.card:hover .card-link{opacity:1}
.counter{text-align:center;padding:10px;color:var(--text-dim)}
footer{text-align:center;padding:30px;color:var(--text-dim);border-top:1px solid var(--border)}
@media(max-width:768px){.grid{grid-template-columns:1fr;padding:15px}.header{padding:30px 20px}.header h1{font-size:1.8em}.controls{padding:15px}}
</style>

const catColors={'طبي':'#6c63ff','تجارة':'#00d4aa','خدمات':'#ff6b6b','رياضة':'#ffd93d','تعليم':'#4ecdc4','سفر':'#45b7d1','سيارات':'#96ceb4','مطاعم':'#ff9ff3','قانون':'#54a0ff','عقارات':'#5f27cd','تصميم':'#f368e0','لوجستيات':'#ff9f43','تطبيقات':'#00d2d3','مناسبات':'#ff6348','نيكسيرا':'#6c63ff','ميريديان':'#00d4aa','صحة':'#2ed573'};
const grid=document.getElementById('grid');
const search=document.getElementById('search');
const filtersEl=document.getElementById('filters');
const counter=document.getElementById('counter');
const cats=[...new Set(presentations.map(p=>p.c))].sort();
document.getElementById('category-count').textContent=cats.length;
const totalMB=Math.round(presentations.reduce((s,p)=>s+(p.s||0),0));
document.getElementById('size-total').textContent=totalMB;
let activeFilter='\u0627\u0644\u0643\u0644';
filtersEl.innerHTML='<button class="filter-btn active" data-cat="\u0627\u0644\u0643\u0644">\u0627\u0644\u0643\u0644</button>'+cats.map(c=>'<button class="filter-btn" data-cat="'+c+'">'+c+'</button>').join('');
filtersEl.addEventListener('click',e=>{if(!e.target.classList.contains('filter-btn'))return;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');activeFilter=e.target.dataset.cat;render()});
function render(){const q=search.value.toLowerCase();const filtered=presentations.filter(p=>{const matchCat=activeFilter==='\u0627\u0644\u0643\u0644'||p.c===activeFilter;const matchSearch=!q||p.t.toLowerCase().includes(q)||p.f.toLowerCase().includes(q);return matchSearch&&matchCat});counter.textContent='\u0639\u0631\u0636 '+filtered.length+' \u0645\u0646 '+presentations.length;grid.innerHTML=filtered.map(p=>'<div class="card"><div class="card-preview"><iframe src="'+p.f+'" loading="lazy"></iframe><a class="card-link" href="'+p.f+'" target="_blank">\u0641\u062a\u062d \u0627\u0644\u0639\u0631\u0636</a></div><div class="card-info"><div class="card-title">'+p.t+'</div><div class="card-meta"><span class="card-category" style="background:'+(catColors[p.c]||'#666')+'22;color:'+(catColors[p.c]||'#666')+'">'+p.c+'</span><span class="card-size">'+p.s+'KB</span></div></div></div>').join('')}
search.addEventListener('input',render);render();
</script>
